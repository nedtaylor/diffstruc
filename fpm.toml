name = "diffstruc"
version = "1.1.1"
license = "MIT"
author = "Ned Thaddeus Taylor"
maintainer = "n.t.taylor@exeter.ac.uk"
description = "A Fortran library for automatic differentiation"
copyright = "Copyright 2025, diffstruc contributors"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
macros = ["USE_BLAS"]   # remove or set to [] to disable BLAS acceleration

[library]
source-dir="src"

[dependencies]
coreutils = { git = "https://github.com/nedtaylor/coreutils" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
link=["blas", "lapack"]

[features]
metal.description = "Enable the Apple Metal backend for fpm builds on macOS"
metal.macos.preprocess.cpp.macros = ["DIFFSTRUC_ENABLE_METAL_BACKEND"]

[profiles]
release-metal = ["release", "metal"]
